<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ССГ 2222 — Календарь</title>
  <!-- FIX: пути ../../ т.к. clnd теперь в svts/clnd/, а не в корне -->
  <link rel="stylesheet" href="../../main.css">
  <link rel="stylesheet" href="../../embl.css">
  <link rel="stylesheet" href="../../mble.css">
  <link rel="stylesheet" href="../../svts/svts.css">
  <link rel="stylesheet" href="clnd.css">
  <script>
    try {
      var savedLang = localStorage.getItem('usc-lang') || 'ru';
      document.documentElement.lang = savedLang;
      document.documentElement.dataset.lang = savedLang;
    } catch(e) {}
  </script>
</head>
<body class="landing" data-inject="chrome" data-base="../../">

  <!-- FIX: фон-фото -->
  <div id="usc-bg"></div>

  <!-- FIX: шапка (как в svts.html) -->
  <header class="site-header">
    <div class="header-inner">
      <button id="menu-toggle" aria-label="Menu">☰</button>
      <nav class="site-menu" id="main-menu"></nav>
      <nav class="lang-switch" id="lang-switch"></nav>
      <button id="usc-theme-toggle">◐</button>
    </div>
  </header>

  <!-- КОНТЕНТ -->
  <section class="hero">
    <div class="hero-emblem">
      <!-- FIX: было <svg id="svgCanvas"> — embl.js рисует на <canvas>, как в svts.html -->
      <canvas id="svgCanvas" width="190" height="190"></canvas>
    </div>
    <h1 id="tr-clnd-title"></h1>
    <p class="hero-epigraph"></p>
  </section>

  <section class="panel">
    <div class="clnd-calendar-grid" id="clnd-grid"></div>
    <!-- Эпоха перенесена вниз -->
    <span class="clnd-epoch-inline" id="tr-clnd-epoch"></span>
  </section>

  <section class="panel">
    <div class="clnd-description">
      <h3 id="tr-clnd-col1-title"></h3>
      <p id="tr-clnd-col1-text"></p>
      <h3 id="tr-clnd-col2-title"></h3>
      <p id="tr-clnd-col2-text"></p>
      <h3 id="tr-clnd-col3-title"></h3>
      <p id="tr-clnd-col3-text"></p>
      <h3 id="tr-clnd-col4-title"></h3>
      <p id="tr-clnd-col4-text"></p>
    </div>
  </section>

  <!-- FIX: подвал (как в svts.html) -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span id="tr-footer"></span>
      <a href="https://t.me/s_mars_r" target="_blank" rel="noopener">Telegram</a>
    </div>
  </footer>

  <!-- FIX: путь к boot.js -->
  <script src="../../js/boot.js"></script>
  <script src="clnd.js"></script>
</body>
</html>
