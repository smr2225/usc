<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калейдоскоп</title>
<style>
:root{color-scheme:light dark; --bg:rgba(255,240,250,.68); --fg:#087a86; --fg2:rgba(8,122,134,.14)}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden; background:#fff3f8;
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none}
canvas{position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab}
canvas:active{cursor:grabbing}
button{font:inherit; font-weight:800; font-size:15px; padding:8px 10px; border:0; border-radius:8px; background:none; color:var(--fg);
  cursor:pointer; text-shadow:0 0 5px rgba(255,255,255,.85); width:100%; text-align:left}
button:hover{background:var(--fg2)}
button:disabled{opacity:.4; cursor:default; background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg); outline-offset:1px}
#burger{position:fixed; top:calc(8px + env(safe-area-inset-top,0px)); right:8px; width:42px; height:42px; padding:0; z-index:5;
  border-radius:12px; font-size:24px; line-height:42px; text-align:center; background:var(--bg); opacity:.7; transition:opacity .2s;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
#burger:hover,#burger[aria-expanded="true"]{opacity:1}
body.drag #burger{opacity:0; pointer-events:none}
.ui{position:fixed; right:8px; top:calc(58px + env(safe-area-inset-top,0px)); z-index:4; display:none; grid-template-columns:1fr; gap:2px;
  width:220px; max-height:calc(100% - 70px - env(safe-area-inset-top,0px)); overflow-y:auto; padding:8px; border-radius:14px;
  background:var(--bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--fg)}
.ui.open{display:grid}
.bar{display:contents}
@media (max-height:520px){ .ui{width:420px; grid-template-columns:1fr 1fr} }
.scrub{grid-column:1/-1; opacity:.45; text-shadow:0 0 5px rgba(255,255,255,.85); padding:2px 4px 6px; font-weight:800}
.scrub.hot{opacity:1}
.stitle{display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:2px}
.srow{display:flex; align-items:center; gap:8px; font-size:13px}
.scrub input{flex:1; min-width:0; height:22px; accent-color:var(--fg); background:none; cursor:pointer}
.scrub input:disabled{cursor:default}
.scrub #tl{min-width:34px; text-align:right}
.stones{grid-column:1/-1; padding:6px 4px 2px; font-weight:800; text-shadow:0 0 5px rgba(255,255,255,.85)}
.sttl{display:block; font-size:12px; margin-bottom:3px}
#stonesRow{display:flex; flex-wrap:wrap; gap:3px; align-items:center}
.hint{grid-column:1/-1; margin:4px 0 0; padding:8px 10px; border-radius:10px; background:var(--bg); font-weight:800; font-size:12.5px; line-height:1.35;
  color:var(--fg); text-shadow:0 0 5px rgba(255,255,255,.85)}
#burger.flash{opacity:1; background:rgba(255,209,102,.95); color:#3b1d6e; text-shadow:none; animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.85)}50%{box-shadow:0 0 0 12px rgba(255,209,102,0)}}
</style>
</head>
<body>
<canvas id="c" aria-label="Калейдоскоп: крутите пальцем или мышью"></canvas>
<button id="burger" aria-label="Меню" aria-expanded="false">≡</button>
<div class="ui" id="ui">
  <div class="scrub" id="scrub">
    <div class="stitle"><span>Записано</span><span id="cur"></span></div>
    <div class="srow"><span>0</span><input id="sl" type="range" min="0" max="1" step="1" value="0" disabled aria-label="Повтор: вернуться назад по записанному движению (после остановки)"><span id="tl">0</span></div>
  </div>
  <div class="bar">
    <button id="shake">Встряхнуть</button>
    <button id="play">Крутить: стоп</button>
    <button id="mode">3 зеркала</button>
    <button id="cnt">Камней: много</button>
    <button id="size">Масштаб: 1:2</button>
    <button id="lite" hidden>Движение: простое</button>
    <button id="full">На весь экран</button>
  </div>
  <div class="stones"><span class="sttl">Камни: <span id="palName"></span></span><div id="stonesRow"></div></div>
  <p class="hint" id="hint">Встряхнуть: двойной клик или касание. Крутить: нажать и вести пальцем или мышью. Кнопка «Крутить» переключает скорость и стоп.</p>
</div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var oc=document.createElement('canvas'), octx=oc.getContext('2d');
  var ocLo=document.createElement('canvas'), octxLo=ocLo.getContext('2d');
  var sizes=[{n:'1:1',k:.80},{n:'1:2',k:.40},{n:'1:3',k:.267},{n:'1:4',k:.20}], si=1;
  var modes=[{n:'3 зеркала',rad:false},{n:'5 лучей',rad:true,N:10},{n:'8 лучей',rad:true,N:16}], mi=0;
  var counts=[{n:'мало',F:1.2},{n:'средне',F:1.8},{n:'много',F:2.3},{n:'густо',F:2.7}], ci=2;
  var playing=true, rot=0, vrot=0.004, pieces=[];
  var pal=[], tint='#ffeaf4', acc=null, rounds=0;
  var W=0,H=0,dpr=1,qual=1,dragging=false,lastA=0,TAU=Math.PI*2, PAD=3;
  var L=0,Hh=0,Rc=0,ocw=0,och=0,Gx=0,Gy=0,Ax=0,Ay=0,Bx=0,By=0,Cx=0,Cy=0,tiles=[];
  var PP=1, UU=1, Rr=1;
  var G=0.001, DAMP=0.955, RHO=0.55, layers=[[],[]], byId=[], mxSp=0, awake=false, quiet=0;
  var lite=false, lo=false, dirty=true, wasMoving=false, skip=false, wakeT=0;
  var F=300, stride=1, hist=null, hhead=0, hcount=0, histDirty=false, scrubbing=false, rsi=0;
  var LX=-.42, LY=-.52, LZ=.74;

  function rnd(a,b){return a+Math.random()*(b-a)}

  /* цвета: семейства палитр.
     классические по кругу цветов 30%, тёплые 10%, холодные 8%, монохром с вкраплениями 12%, земляные 10%,
     сепия 5%, пастельные 7%, глубокие 6%, случайные 12%; зелёный выбирается реже */
  var schemes=[[0,30,60,180],[0,120,240],[0,150,210],[0,60,180,240],[0,25,50,180,205],[0,90,180,270],
    [0,180],[0,15,30,45],[0,20,40,60,80],[0,40,80,120,160],[0,72,144,216,288],[0,60,120,180,240,300],
    [0,20,180,200],[0,10,120,130,240,250],[0,30,60,90,120,150,180]];
  var tintC0='#ffffff', accMax=3, accIdx=[], pool=[], main=[], pname='';
  function pickHue(){ var h; do{ h=rnd(0,360); } while(h>=75&&h<165&&Math.random()<.55); return h; }
  function add(hh,sat,l){
    var h=Math.round(((hh%360)+360)%360);
    pal.push({h:h,s:sat,l:l},{h:h,s:Math.max(20,sat-4),l:Math.min(90,l+7)},{h:h,s:sat,l:Math.max(14,l-5)});
    main.push({h:h,s:sat,l:l});
  }
  function offs(arr,base,sat,l){ for(var i=0;i<arr.length;i++) add(base+arr[i],sat,l); }
  function renderStones(){
    var el=document.getElementById('stonesRow'), pn=document.getElementById('palName'), html='', i;
    if(!el) return;
    if(pn) pn.textContent=pname;
    function gem(c){ return '<svg width="18" height="16" viewBox="0 0 20 18" aria-hidden="true"><path d="M5 1H15L19 7L10 17L1 7Z" style="fill:hsl('+c.h+','+c.s+'%,'+c.l+'%);stroke:rgba(0,0,0,.3);stroke-width:1;stroke-linejoin:round"/></svg>'; }
    for(i=0;i<main.length;i++) html+=gem(main[i]);
    if(acc) html+='<span style="width:8px;display:inline-block"></span>'+gem(acc);
    el.innerHTML=html;
  }
  function setTheme(h){
    var rs=document.documentElement.style, c=Math.round((h+180)%360);
    if(!rs||!rs.setProperty) return;
    rs.setProperty('--bg','hsla('+Math.round(h)+',100%,93%,.7)');
    rs.setProperty('--fg','hsl('+c+',92%,32%)');
    rs.setProperty('--fg2','hsla('+c+',92%,32%,.14)');
  }
  function scheme(){
    var r=Math.random(), h=pickHue(), th, i, sc, list, m, c, ac, n, ix, ll=[26,38,50,62,74];
    pal=[]; main=[]; acc=null; accMax=3; tintC0='#ffffff'; pool=[]; accIdx=[];
    rounds=Math.random()<.2?rnd(.3,.55):0;
    th=h;
    if(r<.50){
      sc=schemes[Math.floor(rnd(0,schemes.length))]; offs(sc,h,100,50);
      if(Math.random()<.6) acc={h:Math.round((h+rnd(40,320))%360),s:100,l:50};
      tint='hsl('+Math.round(h)+',100%,90%)';
    } else if(r<.555){
      h=rnd(-15,35); offs([0,15,30,45],h,100,50); add(h-8,92,38);
      if(Math.random()<.5) acc={h:Math.round(rnd(180,230)),s:80,l:45};
      th=h+20; tint='hsl('+Math.round(((th%360)+360)%360)+',100%,91%)';
    } else if(r<.60){
      h=rnd(165,215); offs([0,20,45,70],h,90,48);
      if(Math.random()<.5) acc={h:Math.round(rnd(15,45)),s:100,l:52};
      th=h+30; tint='hsl('+Math.round(th%360)+',100%,91%)';
    } else if(r<.67){
      for(i=0;i<5;i++){ c={h:Math.round(((h+rnd(-6,6))%360+360)%360),s:Math.round(rnd(75,100)),l:ll[i]}; pal.push(c); main.push(c); }
      acc={h:Math.round((h+(Math.random()<.5?180:rnd(60,300)))%360),s:95,l:50};
      tint='hsl('+Math.round(h)+',100%,90%)';
    } else if(r<.70){
      list=[{h:38,s:78,l:50},{h:24,s:42,l:28},{h:14,s:58,l:46},{h:68,s:42,l:36},{h:28,s:52,l:32},{h:44,s:55,l:84},{h:18,s:62,l:38},{h:40,s:45,l:68}];
      list.sort(function(){ return Math.random()-.5; });
      for(i=0;i<5;i++) add(list[i].h,list[i].s,list[i].l);
      ac=[{h:175,s:75,l:42},{h:5,s:80,l:48},{h:215,s:70,l:46}]; acc=ac[Math.floor(rnd(0,3))]; accMax=2;
      th=36; tint='hsl(36,60%,90%)';
    } else if(r<.73){
      list=[{h:32,s:38,l:20},{h:32,s:36,l:30},{h:34,s:40,l:45},{h:36,s:34,l:62},{h:40,s:38,l:82}];
      for(i=0;i<list.length;i++) add(list[i].h,list[i].s,list[i].l);
      if(Math.random()<.4) acc=Math.random()<.5?{h:205,s:28,l:50}:{h:350,s:32,l:56};
      accMax=1; th=38; tint='hsl(40,42%,88%)'; tintC0='#fff8ec';
    } else if(r<.77){
      sc=schemes[Math.floor(rnd(0,schemes.length))]; offs(sc,h,65,76);
      if(Math.random()<.4) acc={h:Math.round((h+rnd(40,320))%360),s:70,l:62};
      tint='hsl('+Math.round(h)+',100%,94%)';
    } else if(r<.80){
      sc=schemes[Math.floor(rnd(0,schemes.length))]; offs(sc,h,90,34);
      if(Math.random()<.4) acc={h:Math.round((h+rnd(40,320))%360),s:95,l:45};
      tint='hsl('+Math.round(h)+',100%,88%)';
    } else {
      sc=[0]; m=2+Math.floor(rnd(0,6)); for(i=0;i<m;i++) sc.push(rnd(20,340));
      offs(sc,h,100,50);
      tint='hsl('+Math.round(h)+',100%,90%)';
    }
    if(acc){
      n=1+Math.floor(rnd(0,accMax));
      while(accIdx.length<n){ ix=10+Math.floor(rnd(0,35)); if(accIdx.indexOf(ix)<0) accIdx.push(ix); }
    }
    pname=r<.50?'круг цветов':r<.555?'тёплые':r<.60?'холодные':r<.67?'монохром':r<.70?'земляные':r<.73?'сепия':r<.77?'пастельные':r<.80?'глубокие':'случайные';
    setTheme(th); renderStones();
  }
  /* общий набор камней: одни и те же камни при смене числа, масштаба и режима */
  function poolGet(n){
    while(pool.length<n){
      var p=make(), ix=pool.length;
      if(acc && accIdx.indexOf(ix)>=0){ p.h=acc.h; p.sat=acc.s; p.l=acc.l; p.clear=false; p.mul=true; if(p.s>=.2) p.s=rnd(.1,.18); }
      pool.push(p);
    }
    return pool[n-1];
  }

  /* неправильные огранённые камни: выпуклая оболочка случайных точек */
  function hull(P){
    var n=P.length, faces=[], seen={}, i, j, k, m;
    for(i=0;i<n;i++) for(j=i+1;j<n;j++) for(k=j+1;k<n;k++){
      var a=P[i], b=P[j], c=P[k];
      var ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2], wx=c[0]-a[0], wy=c[1]-a[1], wz=c[2]-a[2];
      var nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx, ln=Math.sqrt(nx*nx+ny*ny+nz*nz);
      if(ln<1e-6) continue;
      nx/=ln; ny/=ln; nz/=ln;
      var pos=0, neg=0, on=[i,j,k], d;
      for(m=0;m<n;m++){
        if(m===i||m===j||m===k) continue;
        d=nx*(P[m][0]-a[0])+ny*(P[m][1]-a[1])+nz*(P[m][2]-a[2]);
        if(d>1e-5) pos++; else if(d<-1e-5) neg++; else on.push(m);
      }
      if(pos&&neg) continue;
      var key=on.slice().sort(function(p,q){return p-q}).join(',');
      if(seen[key]) continue; seen[key]=1;
      var cx=0, cy=0, cz=0, t;
      for(t=0;t<on.length;t++){ cx+=P[on[t]][0]; cy+=P[on[t]][1]; cz+=P[on[t]][2]; }
      cx/=on.length; cy/=on.length; cz/=on.length;
      var el=Math.sqrt(ux*ux+uy*uy+uz*uz)+1e-9, e1x=ux/el, e1y=uy/el, e1z=uz/el;
      var e2x=ny*e1z-nz*e1y, e2y=nz*e1x-nx*e1z, e2z=nx*e1y-ny*e1x;
      var ang=[];
      for(t=0;t<on.length;t++){
        var px=P[on[t]][0]-cx, py=P[on[t]][1]-cy, pz=P[on[t]][2]-cz;
        ang.push({i:on[t], a:Math.atan2(px*e2x+py*e2y+pz*e2z, px*e1x+py*e1y+pz*e1z)});
      }
      ang.sort(function(p,q){return p.a-q.a});
      faces.push(ang.map(function(o){return o.i}));
    }
    return faces;
  }
  function surf(P,F){
    var S=0, i, t, f, a, b, c, ux, uy, uz, wx, wy, wz, nx, ny, nz;
    for(i=0;i<F.length;i++){
      f=F[i];
      for(t=1;t<f.length-1;t++){
        a=P[f[0]]; b=P[f[t]]; c=P[f[t+1]];
        ux=b[0]-a[0]; uy=b[1]-a[1]; uz=b[2]-a[2]; wx=c[0]-a[0]; wy=c[1]-a[1]; wz=c[2]-a[2];
        nx=uy*wz-uz*wy; ny=uz*wx-ux*wz; nz=ux*wy-uy*wx;
        S+=.5*Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
    }
    return S/4;
  }
  function geom(){
    var r=Math.random(), n=7+Math.floor(rnd(0,5)), sx, sy, sz, P=[], i, a, b, x, y, z, rr, mx=0;
    if(r<.5){ sx=rnd(.7,1.2); sy=rnd(.7,1.2); sz=rnd(.7,1.2); }
    else if(r<.8){ sx=rnd(.9,1.2); sy=rnd(.6,1); sz=rnd(.15,.32); }
    else { sx=rnd(2,3); sy=rnd(.3,.5); sz=rnd(.3,.5); }
    for(i=0;i<n;i++){
      a=rnd(0,TAU); z=rnd(-1,1); b=Math.sqrt(1-z*z); rr=rnd(.75,1.1);
      x=Math.cos(a)*b*rr*sx; y=Math.sin(a)*b*rr*sy; z=z*rr*sz;
      P.push([x,y,z]); mx=Math.max(mx,Math.hypot(x,y,z));
    }
    for(i=0;i<n;i++){ P[i][0]/=mx; P[i][1]/=mx; P[i][2]/=mx; }
    var f=hull(P);
    return {v:P, f:f, A:surf(P,f)};
  }

  function make(){
    var c=pal[Math.floor(rnd(0,pal.length))], bead=Math.random()<rounds, g=bead?null:geom(), clear=!bead&&Math.random()<.12;
    var q=Math.random(), s=q<.2?rnd(.30,.50):(q<.6?rnd(.18,.30):rnd(.08,.16));
    return {id:0, x:0, y:0, px:0, py:0, vx:0, vy:0, rho:0, layer:0, press:0, s:s,
      th:0, rr:0, r0:0, tt:rnd(0,TAU), om:rnd(-.0035,.0035), wr:rnd(.008,.02), amp:rnd(.02,.07), vax:rnd(-.016,.016), vay:rnd(-.016,.016), vaz:rnd(-.012,.012),
      ax:rnd(0,TAU), ay:rnd(0,TAU), az:rnd(0,TAU),
      t1:rnd(.6,1.4)*(Math.random()<.5?-1:1), t2:rnd(.6,1.4)*(Math.random()<.5?-1:1), t3:rnd(.4,1)*(Math.random()<.5?-1:1),
      g:g, bx:rnd(.75,1), by:rnd(.6,1), h:c.h, sat:clear?35:c.s, l:clear?90:c.l, mul:!clear&&Math.random()<.6, clear:clear,
      rx:g?new Float32Array(g.v.length):null, ry:g?new Float32Array(g.v.length):null, rz:g?new Float32Array(g.v.length):null,
      faces:[], pa:0, cw:0};
  }

  /* физика ячейки: круг радиуса 1, два слоя между стёклами; в слое камни почти не налезают друг на друга,
     между слоями перекрываются свободно; тяжесть направлена вниз по экрану, а ячейка повёрнута на rot */
  function rebuildLayers(){
    layers=[[],[]];
    for(var i=0;i<pieces.length;i++) layers[pieces[i].layer].push(pieces[i]);
    pieces.sort(function(a,b){ return a.layer-b.layer || b.s-a.s; });
  }
  function solve(last){
    var i, j, a, b, dx, dy, d2, m, d, s, wa, wb, t, l, list, n;
    for(i=0;i<pieces.length;i++){
      a=pieces[i]; d=Math.sqrt(a.x*a.x+a.y*a.y); t=1-.3*a.rho;
      if(d>t){ a.x*=t/d; a.y*=t/d; }
      if(last) a.press=0;
    }
    for(l=0;l<2;l++){
      list=layers[l]; n=list.length;
      for(i=0;i<n;i++){
        a=list[i];
        for(j=i+1;j<n;j++){
          b=list[j]; dx=b.x-a.x; if(dx>.5||dx<-.5) continue;
          dy=b.y-a.y; if(dy>.5||dy<-.5) continue;
          d2=dx*dx+dy*dy; m=.85*(a.rho+b.rho);
          if(d2<m*m && d2>1e-12){
            d=Math.sqrt(d2); s=(m-d)/d; wa=1/(a.rho*a.rho); wb=1/(b.rho*b.rho); t=wa+wb;
            a.x-=dx*s*wa/t; a.y-=dy*s*wa/t; b.x+=dx*s*wb/t; b.y+=dy*s*wb/t;
            if(last){ a.press+=m-d; b.press+=m-d; }
          }
        }
      }
    }
  }
  function substep(){
    var gx=Math.sin(rot)*G, gy=Math.cos(rot)*G, i, p, it, sp; mxSp=0;
    for(i=0;i<pieces.length;i++){
      p=pieces[i]; p.px=p.x; p.py=p.y; p.vx=(p.vx+gx)*DAMP; p.vy=(p.vy+gy)*DAMP; p.x+=p.vx; p.y+=p.vy;
    }
    for(it=0;it<3;it++) solve(it===2);
    for(i=0;i<pieces.length;i++){
      p=pieces[i]; p.vx=p.x-p.px; p.vy=p.y-p.py; sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy); if(sp>mxSp) mxSp=sp;
      if(sp<2e-5){ p.vx=0; p.vy=0; }
      else { p.ax+=p.t1*sp*1.6; p.ay+=p.t2*sp*1.6; p.az+=p.t3*sp*1.6; }
    }
  }
  function physics(){
    var mm=0, i, n=lite?3:4;
    for(i=0;i<n;i++){ substep(); if(mxSp>mm) mm=mxSp; }
    return mm;
  }
  function flipPass(){
    var i, p, fl=false;
    for(i=0;i<pieces.length;i++){
      p=pieces[i];
      if(p.press>.3*p.rho && Math.random()<.25){ p.layer^=1; fl=true; }
    }
    if(fl) rebuildLayers();
  }

  function build(p){

  /* повернули или встряхнули: ячейка проворачивается по инерции, камни за 1–2 секунды ложатся по тяжести и замирают.

  function armClose(){ clearTimeout(closeT); closeT=setTimeout(closePanel,10000); }
  burger.onclick=function(){
    if(ui.classList.contains('open')){ closePanel(); return; }
    ui.classList.add('open'); burger.setAttribute('aria-expanded','true'); burger.textContent='✕'; burger.classList.remove('flash');
    syncScrub(); armClose();
  };
  ui.addEventListener('pointerdown',armClose); ui.addEventListener('input',armClose); ui.addEventListener('click',armClose);
  window.addEventListener('keydown',function(e){ if(e.code==='Escape') closePanel(); });
  window.addEventListener('keydown',function(e){ if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){ e.preventDefault(); shake(); } });
  window.addEventListener('resize',resize);
  burger.classList.add('flash'); setTimeout(function(){ burger.classList.remove('flash'); },10000);

  var liteBtn=document.getElementById('lite'), coarse=!!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  lite=false;
  if(coarse){
    liteBtn.hidden=false; liteBtn.textContent='Движение: '+(lite?'простое':'полное');
    liteBtn.onclick=function(){ lite=!lite; this.textContent='Движение: '+(lite?'простое':'полное'); dirty=true; };
  }
  resize(); setRate(1); fill(); loop();
})();
</script>
</body>
</html>
