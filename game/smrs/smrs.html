<!DOCTYPE html>
<!-- Симуляция посадки на Марс. © 2026 smr2225. Все права защищены. -->
<html lang="ru" data-lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ССГ 2222 — Симуляция посадки на Марс</title>
  <link rel="stylesheet" href="../../main.css">
  <link rel="stylesheet" href="../../embl.css">
  <link rel="stylesheet" href="../../mble.css">
  <link rel="stylesheet" href="../../svts/svts.css">
  <link rel="stylesheet" href="smrs.css">
  <script>
    try {
      var savedLang = localStorage.getItem('usc-lang') || 'ru';
      document.documentElement.lang = savedLang;
      document.documentElement.dataset.lang = savedLang;
    } catch(e) {}
  </script>
</head>
<body class="landing" data-inject="chrome" data-base="../../">

  <div id="usc-bg"></div>

  <header class="site-header">
    <div class="header-inner">
      <button id="menu-toggle" aria-label="Menu">☰</button>
      <nav class="site-menu" id="main-menu"></nav>
      <nav class="lang-switch" id="lang-switch"></nav>
      <button id="usc-theme-toggle">◐</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-emblem">
      <canvas id="svgCanvas" width="190" height="190"></canvas>
    </div>
    <h1 id="tr-title"></h1>
    <p class="hero-epigraph" id="tr-subtitle"></p>
  </section>

  <main class="smrs-main">
    <div id="setup" class="smrs-setup">
      <div id="grid"></div>
      <button id="start"></button>
      <p class="hint" id="tr-hint_setup"></p>
    </div>

    <div id="sim" class="smrs-sim">
      <div id="wrap">
        <canvas id="c" width="720" height="720"></canvas>
        <div id="rbar">
          <button id="rplay"></button>
          <input id="rseek" type="range" min="0" max="0" value="0">
          <select id="rspd">
            <option value="0.25">×0,25</option>
            <option value="0.5">×0,5</option>
            <option value="1" selected>×1</option>
            <option value="2">×2</option>
            <option value="4">×4</option>
            <option value="8">×8</option>
            <option value="16">×16</option>
          </select>
          <button id="rclose"></button>
        </div>
        <div id="res">
          <h2 id="rt"></h2>
          <p id="rp"></p>
          <div class="bt">
            <button id="again"></button>
            <button id="replay"></button>
            <button id="next" style="display:none"></button>
            <button id="setupBtn"></button>
          </div>
        </div>
      </div>
      <div id="panel"><h3 id="tr-panel_h"></h3></div>
      <p class="hint" id="tr-hint_sim"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span id="tr-footer"></span>
      <a href="https://t.me/s_mars_r" target="_blank" rel="noopener">Telegram</a>
    </div>
  </footer>

  <script src="../../js/boot.js"></script>
  <script src="smrs.js"></script>
</body>
</html>
