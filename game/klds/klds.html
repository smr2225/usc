<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калейдоскоп</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden; background:#fff3f8;
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none}
canvas{position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab}
canvas:active{cursor:grabbing}
.ui{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(8px + env(safe-area-inset-bottom,0px));
  width:min(780px,96vw); display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px;
  border-radius:14px; background:rgba(40,15,80,.28); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  color:#fff; opacity:.42; transition:opacity .25s, background .25s}
.ui:hover,.ui:focus-within{opacity:1; background:rgba(40,15,80,.6)}
body.drag .ui{opacity:0; pointer-events:none}
.bar{display:flex; flex-wrap:wrap; justify-content:center; gap:0 2px}
button{font:inherit; font-weight:700; font-size:15px; padding:6px 10px; border:0; border-radius:8px; background:none; color:#fff;
  cursor:pointer; text-shadow:0 1px 3px rgba(30,5,60,.85)}
button:hover{background:rgba(255,255,255,.16)}
button{text-align:center}
button:disabled{opacity:.35; cursor:default; background:none}
#shake{min-width:7.4em} #mode{min-width:6.8em} #cnt{min-width:9.4em} #size{min-width:8.8em} #play{min-width:5.2em}
#lite{min-width:11.6em} #tilt{min-width:6.8em} #save{min-width:6.8em} #full{min-width:8.8em}
button:focus-visible,input:focus-visible{outline:2px solid #ffd166; outline-offset:1px}
.scrub{display:flex; align-items:center; gap:8px; width:100%; font-weight:700; font-size:13px; opacity:.4; text-shadow:0 1px 3px rgba(30,5,60,.85)}
.scrub.hot{opacity:1}
.scrub input{flex:1; min-width:0; height:22px; accent-color:#ffd166; background:none; cursor:pointer}
.scrub input:disabled{cursor:default}
.scrub #tl{min-width:56px; text-align:right}
.hint{position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0; text-align:center; padding:0 12px;
  color:#fff; font-weight:800; font-size:17px; text-shadow:0 2px 8px rgba(70,20,120,.7); transition:opacity 1s; pointer-events:none}
@media (pointer:coarse){ .ui{opacity:.5} button{font-size:14px; padding:5px 8px} }
</style>
</head>
<body>
<canvas id="c" aria-label="Калейдоскоп: крутите пальцем или мышью"></canvas>
<p class="hint" id="hint">Крутите узор пальцем или мышью. Двойной клик — встряхнуть.</p>
<div class="ui" id="ui">
  <div class="scrub" id="scrub"><span>−5 с</span><input id="sl" type="range" min="0" max="1000" value="1000" disabled aria-label="Повтор: вернуться назад на несколько секунд (после остановки)"><span id="tl">сейчас</span></div>
  <div class="bar">
    <button id="shake">Встряхнуть</button>
    <button id="mode">3 зеркала</button>
    <button id="cnt">Камней: много</button>
    <button id="size">Масштаб: 1:2</button>
    <button id="play">Крутить</button>
    <button id="lite" hidden>Движение: простое</button>
    <button id="tilt" hidden>Наклон</button>
    <button id="save" hidden>Сохранить</button>
    <button id="full">На весь экран</button>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var oc=document.createElement('canvas'), octx=oc.getContext('2d');
  var ocLo=document.createElement('canvas'), octxLo=ocLo.getContext('2d');
  var sizes=[{n:'1:1',k:.80},{n:'1:2',k:.40},{n:'1:3',k:.267},{n:'1:4',k:.20}], si=1;
  var modes=[{n:'3 зеркала',rad:false},{n:'5 лучей',rad:true,N:10},{n:'8 лучей',rad:true,N:16}], mi=0;
  var counts=[{n:'мало',F:1.2},{n:'средне',F:1.8},{n:'много',F:2.3},{n:'густо',F:2.7}], ci=2;
  var playing=true, rot=0, vrot=0.004, pieces=[];
  var pal=[], tint='#ffeaf4', acc=null, rounds=0;
  var W=0,H=0,dpr=1,qual=1,dragging=false,lastA=0,TAU=Math.PI*2, PAD=3;
  var L=0,Hh=0,Rc=0,ocw=0,och=0,Gx=0,Gy=0,Ax=0,Ay=0,Bx=0,By=0,Cx=0,Cy=0,tiles=[];
  var PP=1, UU=1, Rr=1;
  var G=0.001, DAMP=0.955, RHO=0.55, layers=[[],[]], byId=[], mxSp=0, awake=false, quiet=0;
  var lite=false, lo=false, dirty=true, wasMoving=false, skip=false, wakeT=0;
  var F=330, stride=1, hist=null, ht=null, hhead=0, hcount=0, lastRec=0, scrubbing=false;
  var LX=-.42, LY=-.52, LZ=.74;

  function rnd(a,b){return a+Math.random()*(b-a)}

  /* цвета: половина палитр по кругу цветов (иногда с одним «чужим» камнем), половина случайный набор */
  var schemes=[[0,30,60,180],[0,120,240],[0,150,210],[0,60,180,240],[0,25,50,180,205],[0,90,180,270],
    [0,180],[0,15,30,45],[0,20,40,60,80],[0,40,80,120,160],[0,72,144,216,288],[0,60,120,180,240,300],
    [0,20,180,200],[0,10,120,130,240,250],[0,30,60,90,120,150,180]];
  function scheme(){
    var h=rnd(0,360), sc, i;
    if(Math.random()<.5){
      sc=schemes[Math.floor(rnd(0,schemes.length))];
      acc=Math.random()<.6?{h:Math.round((h+rnd(40,320))%360),s:100,l:50}:null;
    } else {
      sc=[0]; var m=3+Math.floor(rnd(0,5)); for(i=0;i<m;i++) sc.push(rnd(20,340));
      acc=null;
    }
    pal=[];
    for(i=0;i<sc.length;i++){
      var hh=Math.round((h+sc[i])%360);
      pal.push({h:hh,s:100,l:50},{h:hh,s:96,l:57},{h:hh,s:100,l:45});
    }
    tint='hsl('+Math.round(h)+',100%,90%)';
    rounds=Math.random()<.2?rnd(.3,.55):0;
  }

  /* неправильные огранённые камни: выпуклая оболочка случайных точек */
  function hull(P){
    var n=P.length, faces=[], seen={}, i, j, k, m;
    for(i=0;i<n;i++) for(j=i+1;j<n;j++) for(k=j+1;k<n;k++){
      var a=P[i], b=P[j], c=P[k];
      var ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2], wx=c[0]-a[0], wy=c[1]-a[1], wz=c[2]-a[2];
      var nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx, ln=Math.sqrt(nx*nx+ny*ny+nz*nz);
      if(ln<1e-6) continue;
      nx/=ln; ny/=ln; nz/=ln;
      var pos=0, neg=0, on=[i,j,k], d;
      for(m=0;m<n;m++){
        if(m===i||m===j||m===k) continue;
        d=nx*(P[m][0]-a[0])+ny*(P[m][1]-a[1])+nz*(P[m][2]-a[2]);
        if(d>1e-5) pos++; else if(d<-1e-5) neg++; else on.push(m);
      }
      if(pos&&neg) continue;
      var key=on.slice().sort(function(p,q){return p-q}).join(',');
      if(seen[key]) continue; seen[key]=1;
      var cx=0, cy=0, cz=0, t;
      for(t=0;t<on.length;t++){ cx+=P[on[t]][0]; cy+=P[on[t]][1]; cz+=P[on[t]][2]; }
      cx/=on.length; cy/=on.length; cz/=on.length;
      var el=Math.sqrt(ux*ux+uy*uy+uz*uz)+1e-9, e1x=ux/el, e1y=uy/el, e1z=uz/el;
      var e2x=ny*e1z-nz*e1y, e2y=nz*e1x-nx*e1z, e2z=nx*e1y-ny*e1x;
      var ang=[];
      for(t=0;t<on.length;t++){
        var px=P[on[t]][0]-cx, py=P[on[t]][1]-cy, pz=P[on[t]][2]-cz;
        ang.push({i:on[t], a:Math.atan2(px*e2x+py*e2y+pz*e2z, px*e1x+py*e1y+pz*e1z)});
      }
      ang.sort(function(p,q){return p.a-q.a});
      faces.push(ang.map(function(o){return o.i}));
    }
    return faces;
  }
  function surf(P,F){
    var S=0, i, t, f, a, b, c, ux, uy, uz, wx, wy, wz, nx, ny, nz;
    for(i=0;i<F.length;i++){
      f=F[i];
      for(t=1;t<f.length-1;t++){
        a=P[f[0]]; b=P[f[t]]; c=P[f[t+1]];
        ux=b[0]-a[0]; uy=b[1]-a[1]; uz=b[2]-a[2]; wx=c[0]-a[0]; wy=c[1]-a[1]; wz=c[2]-a[2];
        nx=uy*wz-uz*wy; ny=uz*wx-ux*wz; nz=ux*wy-uy*wx;
        S+=.5*Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
    }
    return S/4;
  }
  function geom(){
    var r=Math.random(), n=7+Math.floor(rnd(0,5)), sx, sy, sz, P=[], i, a, b, x, y, z, rr, mx=0;
    if(r<.5){ sx=rnd(.7,1.2); sy=rnd(.7,1.2); sz=rnd(.7,1.2); }
    else if(r<.8){ sx=rnd(.9,1.2); sy=rnd(.6,1); sz=rnd(.15,.32); }
    else { sx=rnd(2,3); sy=rnd(.3,.5); sz=rnd(.3,.5); }
    for(i=0;i<n;i++){
      a=rnd(0,TAU); z=rnd(-1,1); b=Math.sqrt(1-z*z); rr=rnd(.75,1.1);
      x=Math.cos(a)*b*rr*sx; y=Math.sin(a)*b*rr*sy; z=z*rr*sz;
      P.push([x,y,z]); mx=Math.max(mx,Math.hypot(x,y,z));
    }
    for(i=0;i<n;i++){ P[i][0]/=mx; P[i][1]/=mx; P[i][2]/=mx; }
    var f=hull(P);
    return {v:P, f:f, A:surf(P,f)};
  }

  function make(){
    var c=pal[Math.floor(rnd(0,pal.length))], bead=Math.random()<rounds, g=bead?null:geom(), clear=!bead&&Math.random()<.12;
    var q=Math.random(), s=q<.2?rnd(.30,.50):(q<.6?rnd(.18,.30):rnd(.08,.16));
    return {id:0, x:0, y:0, px:0, py:0, vx:0, vy:0, rho:0, layer:0, press:0, s:s,
      th:0, rr:0, r0:0, tt:rnd(0,TAU), om:rnd(-.0035,.0035), wr:rnd(.008,.02), amp:rnd(.02,.07), vax:rnd(-.016,.016), vay:rnd(-.016,.016), vaz:rnd(-.012,.012),
      ax:rnd(0,TAU), ay:rnd(0,TAU), az:rnd(0,TAU),
      t1:rnd(.6,1.4)*(Math.random()<.5?-1:1), t2:rnd(.6,1.4)*(Math.random()<.5?-1:1), t3:rnd(.4,1)*(Math.random()<.5?-1:1),
      g:g, bx:rnd(.75,1), by:rnd(.6,1), h:c.h, sat:clear?35:c.s, l:clear?90:c.l, mul:!clear&&Math.random()<.6, clear:clear,
      rx:g?new Float32Array(g.v.length):null, ry:g?new Float32Array(g.v.length):null, rz:g?new Float32Array(g.v.length):null,
      faces:[], pa:0, cw:0};
  }

  /* физика ячейки: круг радиуса 1, два слоя между стёклами; в слое камни почти не налезают друг на друга,
     между слоями перекрываются свободно; тяжесть направлена вниз по экрану, а ячейка повёрнута на rot */
  function rebuildLayers(){
    layers=[[],[]];
    for(var i=0;i<pieces.length;i++) layers[pieces[i].layer].push(pieces[i]);
    pieces.sort(function(a,b){ return a.layer-b.layer || b.s-a.s; });
  }
  function solve(last){
    var i, j, a, b, dx, dy, d2, m, d, s, wa, wb, t, l, list, n;
    for(i=0;i<pieces.length;i++){
      a=pieces[i]; d=Math.sqrt(a.x*a.x+a.y*a.y); t=1-.3*a.rho;
      if(d>t){ a.x*=t/d; a.y*=t/d; }
      if(last) a.press=0;
    }
    for(l=0;l<2;l++){
      list=layers[l]; n=list.length;
      for(i=0;i<n;i++){
        a=list[i];
        for(j=i+1;j<n;j++){
          b=list[j]; dx=b.x-a.x; if(dx>.5||dx<-.5) continue;
          dy=b.y-a.y; if(dy>.5||dy<-.5) continue;
          d2=dx*dx+dy*dy; m=.85*(a.rho+b.rho);
          if(d2<m*m && d2>1e-12){
            d=Math.sqrt(d2); s=(m-d)/d; wa=1/(a.rho*a.rho); wb=1/(b.rho*b.rho); t=wa+wb;
            a.x-=dx*s*wa/t; a.y-=dy*s*wa/t; b.x+=dx*s*wb/t; b.y+=dy*s*wb/t;
            if(last){ a.press+=m-d; b.press+=m-d; }
          }
        }
      }
    }
  }
  function substep(){
    var gx=Math.sin(rot)*G, gy=Math.cos(rot)*G, i, p, it, sp; mxSp=0;
    for(i=0;i<pieces.length;i++){
      p=pieces[i]; p.px=p.x; p.py=p.y; p.vx=(p.vx+gx)*DAMP; p.vy=(p.vy+gy)*DAMP; p.x+=p.vx; p.y+=p.vy;
    }
    for(it=0;it<3;it++) solve(it===2);
    for(i=0;i<pieces.length;i++){
      p=pieces[i]; p.vx=p.x-p.px; p.vy=p.y-p.py; sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy); if(sp>mxSp) mxSp=sp;
      if(sp<2e-5){ p.vx=0; p.vy=0; }
      else { p.ax+=p.t1*sp*1.6; p.ay+=p.t2*sp*1.6; p.az+=p.t3*sp*1.6; }
    }
  }
  function physics(){
    var mm=0, i, n=lite?3:4;
    for(i=0;i<n;i++){ substep(); if(mxSp>mm) mm=mxSp; }
    return mm;
  }
  function flipPass(){
    var i, p, fl=false;
    for(i=0;i<pieces.length;i++){
      p=pieces[i];
      if(p.press>.3*p.rho && Math.random()<.25){ p.layer^=1; fl=true; }
    }
    if(fl) rebuildLayers();
  }

  /* камней столько, чтобы заполнить круг до нужной доли ёмкости двух слоёв.
     В «3 зеркала» они падают под тяжестью; в лучевых физики нет, камни ровно расставлены и медленно кружат */
  function populate(keep,pour){
    if(!keep||!pal.length) scheme();
    var rad=modes[mi].rad, k=rad?.8:1, target=counts[ci].F*(rad?1.4:1), sum=0, list=[], cap=rad?240:200, i, j, t, p, a, r, tries, N;
    while(sum<target && list.length<cap){ p=make(); p.rho=RHO*p.s*k; sum+=p.rho*p.rho; list.push(p); }
    N=list.length;
    if(rad){
      var perm=[];
      for(i=0;i<N;i++) perm.push(i);
      for(i=N-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
      for(i=0;i<N;i++){
        p=list[i]; p.id=i; p.layer=0;
        p.r0=1.04*Math.sqrt((perm[i]+.5+rnd(-.3,.3))/N); p.th=perm[i]*2.3999632+rnd(-.25,.25); p.rr=p.r0;
        p.x=p.rr*Math.cos(p.th); p.y=p.rr*Math.sin(p.th);
      }
    } else {
      for(i=0;i<N;i++){
        p=list[i]; p.id=i; p.layer=Math.random()<.5?0:1;
        a=rnd(0,TAU); r=Math.sqrt(Math.random())*.95; p.x=Math.cos(a)*r; p.y=Math.sin(a)*r; p.vx=0; p.vy=0;
      }
    }
    if(acc){
      var m=1+Math.floor(rnd(0,3));
      for(i=0;i<m;i++){
        for(tries=0;tries<12;tries++){
          p=list[Math.floor(rnd(0,list.length))];
          if(p && p.s<.2){ p.h=acc.h; p.sat=acc.s; p.l=acc.l; p.clear=false; p.mul=true; break; }
        }
      }
    }
    byId=list.slice(); pieces=list; rebuildLayers();
    stride=1+5*byId.length; hist=new Float32Array(F*stride); ht=new Float64Array(F); hhead=0; hcount=0;
    scrubbing=false; sl.value=1000; tl.textContent='сейчас';
    units();
    awake=false; quiet=0; dirty=true;
    if(!rad){
      var n=pour?160:400;
      for(i=0;i<n;i++){ substep(); if(i%25===24) flipPass(); }
      if(pour) wake(); else awake=false;
    }
  }
  function fill(){ populate(false,true); }

  /* зеркала: плитка из отражённых треугольников; считается один треугольник, остальные — его отражения */
  function reflectM(px,py,qx,qy){
    var dx=qx-px, dy=qy-py, l=Math.hypot(dx,dy); dx/=l; dy/=l;
    var a=2*dx*dx-1, c=2*dx*dy, b=c, d=2*dy*dy-1;
    return [a,b,c,d, px-a*px-c*py, py-b*px-d*py];
  }
  function comp(M,N){
    return [M[0]*N[0]+M[2]*N[1], M[1]*N[0]+M[3]*N[1], M[0]*N[2]+M[2]*N[3], M[1]*N[2]+M[3]*N[3],
            M[0]*N[4]+M[2]*N[5]+M[4], M[1]*N[4]+M[3]*N[5]+M[5]];
  }
  function layout(){
    var k=sizes[si].k;
    L=Math.max(60,Math.min(W,H)*k); Hh=L*Math.sqrt(3)/2; Rc=L/Math.sqrt(3);
    ocw=L+2*PAD; och=Hh+2*PAD;
    oc.width=Math.ceil(ocw*dpr); oc.height=Math.ceil(och*dpr);
    ocLo.width=Math.ceil(ocw*dpr*.55); ocLo.height=Math.ceil(och*dpr*.55);
    Ax=PAD; Ay=PAD+Hh; Bx=PAD+L; By=PAD+Hh; Cx=PAD+L/2; Cy=PAD; Gx=PAD+L/2; Gy=PAD+2*Hh/3;
    var refl=[reflectM(Ax,Ay,Bx,By), reflectM(Bx,By,Cx,Cy), reflectM(Cx,Cy,Ax,Ay)];
    var M0=[1,0,0,1,W/2-Gx,H/2-Gy], seen={}, q=[M0], M, N, key, j;
    function keyOf(T){ return Math.round((T[0]*Gx+T[2]*Gy+T[4])*2)+','+Math.round((T[1]*Gx+T[3]*Gy+T[5])*2); }
    seen[keyOf(M0)]=1; tiles=[];
    while(q.length){
      M=q.pop(); tiles.push(M);
      for(j=0;j<3;j++){
        N=comp(M,refl[j]);
        var gx=N[0]*Gx+N[2]*Gy+N[4], gy=N[1]*Gx+N[3]*Gy+N[5];
        if(gx<-L||gx>W+L||gy<-L||gy>H+L) continue;
        key=keyOf(N); if(seen[key]) continue; seen[key]=1; q.push(N);
      }
    }
  }
  function units(){
    Rr=Math.hypot(W,H)/2;
    if(modes[mi].rad){ PP=Rr; UU=Rr*.8; } else { PP=Rc; UU=Rc; }
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5)*qual;
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    layout(); units(); dirty=true;
  }

  function build(p){
    if(!p.g) return;
    var S=p.s*UU, i, k, j;
    var cx=Math.cos(p.ax), sx=Math.sin(p.ax), cy=Math.cos(p.ay), sy=Math.sin(p.ay), cz=Math.cos(p.az), sz=Math.sin(p.az);
    var V=p.g.v, X=p.rx, Y=p.ry, Z=p.rz, v, x, y, z, y1, z1, x2;
    for(i=0;i<V.length;i++){
      v=V[i]; x=v[0]; y=v[1]; z=v[2];
      y1=y*cx-z*sx; z1=y*sx+z*cx;
      x2=x*cy+z1*sy; Z[i]=-x*sy+z1*cy;
      X[i]=x2*cz-y1*sz; Y[i]=x2*sz+y1*cz;
    }
    var faces=[], f, m, a, b, c, ux, uy, uz, wx, wy, wz, nx, ny, nz, ln, t, zz, pts, l, sp, cxm, cym, czm, al=p.mul?0.9:(p.clear?0.5:0.66);
    for(k=0;k<p.g.f.length;k++){
      f=p.g.f[k]; m=f.length; a=f[0]; b=f[1]; c=f[2];
      ux=X[b]-X[a]; uy=Y[b]-Y[a]; uz=Z[b]-Z[a]; wx=X[c]-X[a]; wy=Y[c]-Y[a]; wz=Z[c]-Z[a];
      nx=uy*wz-uz*wy; ny=uz*wx-ux*wz; nz=ux*wy-uy*wx; ln=Math.sqrt(nx*nx+ny*ny+nz*nz)+1e-9;
      t=Math.abs((nx*LX+ny*LY+nz*LZ)/ln);
      zz=0; cxm=0; cym=0; czm=0; pts=[];
      for(j=0;j<m;j++){ zz+=Z[f[j]]; cxm+=X[f[j]]; cym+=Y[f[j]]; czm+=Z[f[j]]; pts.push(X[f[j]]*S, Y[f[j]]*S); }
      l=p.l+(t-.5)*26; l=l<32?32:(l>94?94:l);
      sp=t>.85?(t-.85)*3:0;
      faces.push({z:zz/m, fr:(nz*((nx*cxm+ny*cym+nz*czm)>=0?1:-1))>0, pts:pts, fill:'hsla('+p.h+','+p.sat+'%,'+Math.round(l)+'%,'+al+')', sp:sp});
    }
    faces.sort(function(q,r){return q.z-r.z});
    p.faces=faces;
  }

  function pathPts(c,pts){
    c.beginPath(); c.moveTo(pts[0],pts[1]);
    for(var i=2;i<pts.length;i+=2) c.lineTo(pts[i],pts[i+1]);
    c.closePath();
  }
  function drawPiece(c,p){
    var S=p.s*UU, k, f;
    c.save(); c.translate(p.x*PP,p.y*PP);
    if(lo){
      if(!p.g){
        c.scale(p.bx,p.by); c.fillStyle='hsla('+p.h+','+p.sat+'%,'+p.l+'%,.8)'; c.beginPath(); c.arc(0,0,S,0,TAU); c.fill();
      } else {
        c.fillStyle='hsla('+p.h+','+p.sat+'%,'+p.l+'%,.78)'; c.beginPath();
        for(k=0;k<p.faces.length;k++){
          f=p.faces[k]; if(!f.fr) continue;
          var q=f.pts; c.moveTo(q[0],q[1]);
          for(var u=2;u<q.length;u+=2) c.lineTo(q[u],q[u+1]);
          c.closePath();
        }
        c.fill();
      }
    } else if(!p.g){
      var gr=c.createRadialGradient(-S*.25,-S*.25,S*.05,0,0,S);
      gr.addColorStop(0,'hsla('+p.h+','+p.sat+'%,'+Math.min(80,p.l+14)+'%,.85)');
      gr.addColorStop(1,'hsla('+p.h+','+p.sat+'%,'+(p.l-6)+'%,.9)');
      c.scale(p.bx,p.by);
      c.globalCompositeOperation=p.mul?'multiply':'source-over';
      c.globalAlpha=p.mul?1:.62;
      c.beginPath(); c.arc(0,0,S,0,TAU); c.fillStyle=gr; c.fill();
      c.globalCompositeOperation='source-over'; c.globalAlpha=1;
      c.fillStyle='rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(-S*.3,-S*.3,S*.28,S*.16,-.7,0,TAU); c.fill();
      c.lineWidth=1.2; c.strokeStyle='rgba(255,255,255,.55)'; c.beginPath(); c.arc(0,0,S,0,TAU); c.stroke();
    } else {
      c.globalCompositeOperation=p.mul?'multiply':'source-over';
      for(k=0;k<p.faces.length;k++){ f=p.faces[k]; pathPts(c,f.pts); c.fillStyle=f.fill; c.fill(); }
      c.globalCompositeOperation='source-over';
      c.lineWidth=S<22?0.8:1.3; c.strokeStyle='rgba(255,255,255,.65)'; c.lineJoin='round';
      for(k=0;k<p.faces.length;k++){
        f=p.faces[k]; pathPts(c,f.pts);
        if(f.sp){ c.fillStyle='rgba(255,255,255,'+f.sp.toFixed(2)+')'; c.fill(); }
        c.stroke();
      }
    }
    c.restore();
  }

  function paintCell(c,sc){
    var i, e=1+2.4/Rc;
    c.setTransform(sc,0,0,sc,0,0);
    c.clearRect(0,0,ocw,och);
    c.save();
    c.beginPath();
    c.moveTo(Gx+(Ax-Gx)*e,Gy+(Ay-Gy)*e); c.lineTo(Gx+(Bx-Gx)*e,Gy+(By-Gy)*e); c.lineTo(Gx+(Cx-Gx)*e,Gy+(Cy-Gy)*e);
    c.closePath(); c.clip();
    var g=c.createRadialGradient(Gx,Gy,0,Gx,Gy,Rc*1.1);
    g.addColorStop(0,'#ffffff'); g.addColorStop(1,tint);
    c.fillStyle=g; c.fillRect(0,0,ocw,och);
    c.translate(Gx,Gy); c.rotate(rot);
    for(i=0;i<pieces.length;i++){ build(pieces[i]); drawPiece(c,pieces[i]); }
    c.restore();
  }

  function drawRadial(){
    var N=modes[mi].N, a=TAU/N, i, p, d, g, w;
    for(i=0;i<pieces.length;i++){
      p=pieces[i]; d=Math.hypot(p.x,p.y)+1e-4;
      p.pa=((Math.atan2(p.y,p.x)+rot)%TAU+TAU)%TAU;
      p.cw=Math.atan2(p.s*UU/PP*1.3,d);
      build(p);
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle=tint; ctx.fillRect(0,0,cv.width,cv.height);
    for(w=0;w<N;w++){
      ctx.save();
      ctx.setTransform(dpr,0,0,dpr,W/2*dpr,H/2*dpr);
      ctx.rotate(w*a);
      if(w%2){ ctx.rotate(a); ctx.scale(1,-1); }
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Rr,0); ctx.arc(0,0,Rr,0,a); ctx.closePath(); ctx.clip();
      g=ctx.createRadialGradient(0,0,0,0,0,Rr);
      g.addColorStop(0,'#ffffff'); g.addColorStop(1,tint);
      ctx.fillStyle=g; ctx.fillRect(-Rr,-Rr,Rr*2,Rr*2);
      ctx.rotate(rot);
      for(i=0;i<pieces.length;i++){
        p=pieces[i];
        if(!(p.pa<a+p.cw || p.pa>TAU-p.cw)) continue;
        drawPiece(ctx,p);
      }
      ctx.restore();
    }
  }

  function draw(simple){
    lo=simple;
    if(modes[mi].rad){ drawRadial(); return; }
    var cvs=simple?ocLo:oc, cc=simple?octxLo:octx;
    paintCell(cc,dpr*(simple?.55:1));
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle=tint; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality=simple?'low':'high';
    for(var i=0;i<tiles.length;i++){
      var M=tiles[i];
      ctx.setTransform(dpr*M[0],dpr*M[1],dpr*M[2],dpr*M[3],dpr*M[4],dpr*M[5]);
      ctx.drawImage(cvs,0,0,ocw,och);
    }
  }

  /* повернули или встряхнули: ячейка проворачивается по инерции, камни за 1–2 секунды ложатся по тяжести и замирают.
     «Крутить» — медленный автоповорот. В лучевых режимах физики нет. */
  function wake(){ awake=true; quiet=0; wakeT=performance.now(); }
  function step(){
    var i, p, sp;
    if(playing){ vrot+=(0.003-vrot)*0.02; rot+=vrot; }
    else if(!dragging){
      if(Math.abs(vrot)>1e-4){ rot+=vrot; vrot*=.86; wake(); } else vrot=0;
    }
    if(modes[mi].rad){
      if(playing){
        for(i=0;i<pieces.length;i++){
          p=pieces[i]; p.th+=p.om; p.tt+=p.wr; p.rr=p.r0+p.amp*Math.sin(p.tt);
          p.x=p.rr*Math.cos(p.th); p.y=p.rr*Math.sin(p.th);
          p.ax+=p.vax; p.ay+=p.vay; p.az+=p.vaz;
        }
      }
      return;
    }
    if(playing){ wake(); }
    if(!awake) return;
    sp=physics();
    if(sp<3e-4) quiet++; else quiet=0;
    if(!playing && (quiet>8 || performance.now()-wakeT>1800)){
      awake=false; quiet=0;
      for(i=0;i<pieces.length;i++){ pieces[i].vx=0; pieces[i].vy=0; }
    }
  }

  /* история: последние 5 секунд */
  function record(now){
    if(now-lastRec<16) return;
    lastRec=now;
    var b=hhead*stride, i, p;
    hist[b]=rot;
    for(i=0;i<byId.length;i++){ p=byId[i]; hist[b+1+5*i]=p.x; hist[b+2+5*i]=p.y; hist[b+3+5*i]=p.ax; hist[b+4+5*i]=p.ay; hist[b+5+5*i]=p.az; }
    ht[hhead]=now; hhead=(hhead+1)%F; if(hcount<F) hcount++;
  }
  function applyAt(backMs){
    dirty=true;
    if(!hcount) return 0;
    var ni=(hhead-1+F)%F, target=ht[ni]-backMs, idx=ni, k, j, b, p;
    for(k=0;k<hcount;k++){ idx=(ni-k+F)%F; if(ht[idx]<=target) break; }
    b=idx*stride; rot=hist[b];
    for(j=0;j<byId.length;j++){
      p=byId[j]; p.x=hist[b+1+5*j]; p.y=hist[b+2+5*j]; p.ax=hist[b+3+5*j]; p.ay=hist[b+4+5*j]; p.az=hist[b+5+5*j]; p.vx=0; p.vy=0;
      if(modes[mi].rad){ p.th=Math.atan2(p.y,p.x); p.rr=Math.hypot(p.x,p.y); p.r0=p.rr-p.amp*Math.sin(p.tt); }
    }
    return (ht[ni]-ht[idx])/1000;
  }
  var sl=document.getElementById('sl'), tl=document.getElementById('tl'), scrubEl=document.getElementById('scrub');
  function exitScrub(){
    if(!scrubbing) return;
    applyAt(0); scrubbing=false; vrot=0; sl.value=1000; tl.textContent='сейчас';
  }
  sl.addEventListener('input',function(){
    if(playing) return;
    var v=+sl.value;
    if(v>=990){ exitScrub(); return; }
    scrubbing=true;
    var back=applyAt((1000-v)/1000*5000);
    tl.textContent='−'+back.toFixed(1).replace('.',',')+' с';
  });

  function loop(){
    var now=performance.now();
    if(!scrubbing){ step(); if(playing||dragging||awake) record(now); }
    var mv=!scrubbing && (playing||dragging||Math.abs(vrot)>1e-4||(!modes[mi].rad&&awake));
    if(mv){
      if(lite){ skip=!skip; if(!skip) draw(true); }
      else draw(false);
      wasMoving=true;
    } else if(wasMoving||dirty){
      draw(false); wasMoving=false; dirty=false;
    }
    requestAnimationFrame(loop);
  }

  /* управление: нажатие и движение крутят, двойной клик/касание встряхивает */
  function angleOf(e){ return Math.atan2(e.clientY-H/2, e.clientX-W/2); }
  var hint=document.getElementById('hint'), lastTap=0, tapX=0, tapY=0;
  cv.addEventListener('pointerdown',function(e){
    var now=performance.now();
    hint.style.opacity=0;
    if(now-lastTap<350 && Math.hypot(e.clientX-tapX,e.clientY-tapY)<40){ lastTap=0; shake(); return; }
    lastTap=now; tapX=e.clientX; tapY=e.clientY;
    exitScrub(); dragging=true; document.body.classList.add('drag'); lastA=angleOf(e); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var a=angleOf(e), d=a-lastA;
    if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU;
    rot+=d; vrot=d; lastA=a; wake();
  });
  function up(){ dragging=false; document.body.classList.remove('drag'); }
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

  function setPlay(v){
    playing=v; if(!v) vrot=0; dirty=true;
    document.getElementById('play').textContent=v?'Стоп':'Крутить';
    sl.disabled=v; scrubEl.classList.toggle('hot',!v);
  }
  function shake(){ scrubbing=false; sl.value=1000; tl.textContent='сейчас'; fill(); vrot=(Math.random()<.5?-1:1)*rnd(.03,.05); }
  document.getElementById('shake').onclick=shake;
  var sizeBtn=document.getElementById('size'), cntBtn=document.getElementById('cnt'), modeBtn=document.getElementById('mode');
  function setSizeBtn(){ sizeBtn.disabled=modes[mi].rad; sizeBtn.textContent=modes[mi].rad?'Масштаб: —':'Масштаб: '+sizes[si].n; }
  sizeBtn.onclick=function(){ si=(si+1)%sizes.length; setSizeBtn(); layout(); units(); dirty=true; };
  modeBtn.onclick=function(){ mi=(mi+1)%modes.length; this.textContent=modes[mi].n; setSizeBtn(); populate(true); };
  cntBtn.onclick=function(){ ci=(ci+1)%counts.length; this.textContent='Камней: '+counts[ci].n; populate(true); };
  document.getElementById('play').onclick=function(){ exitScrub(); setPlay(!playing); };

  var fbtn=document.getElementById('full');
  fbtn.onclick=function(){
    try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){}
  };
  document.addEventListener('fullscreenchange',function(){ fbtn.textContent=document.fullscreenElement?'Свернуть':'На весь экран'; });

  /* сохранение картинки */
  var sbtn=document.getElementById('save'), dl=null;
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){ if(d){ dl=d; sbtn.hidden=false; } }).catch(function(){});
  }
  sbtn.onclick=function(){
    if(!dl) return;
    cv.toBlob(function(b){
      if(!b) return;
      dl.save({filename:'kaleidoscope.png', data:b}).then(function(r){
        if(r && r.status==='saved'){ sbtn.textContent='Сохранено'; setTimeout(function(){ sbtn.textContent='Сохранить'; },1600); }
      }).catch(function(){});
    },'image/png');
  };

  /* смартфон: поворот телефона крутит узор, встряхивание телефона встряхивает */
  var tbtn=document.getElementById('tilt'), tiltOn=false, lastM=0, lastShake=0, gotMotion=false;
  function onMotion(e){
    var now=performance.now(), r=e.rotationRate, a=e.accelerationIncludingGravity, dt=Math.min(.1,(now-lastM)/1000);
    lastM=now; gotMotion=true;
    if(r && r.alpha!=null && !scrubbing && !dragging){ rot+=r.alpha*Math.PI/180*dt; wake(); }
    if(a){
      var m=Math.hypot(a.x||0,a.y||0,a.z||0);
      if(Math.abs(m-9.8)>16 && now-lastShake>900){ lastShake=now; shake(); }
    }
  }
  if(window.DeviceMotionEvent && window.matchMedia && window.matchMedia('(pointer:coarse)').matches) tbtn.hidden=false;
  tbtn.onclick=function(){
    if(tiltOn){ window.removeEventListener('devicemotion',onMotion); tiltOn=false; tbtn.textContent='Наклон'; return; }
    function go(){
      window.addEventListener('devicemotion',onMotion); tiltOn=true; gotMotion=false; lastM=performance.now(); tbtn.textContent='Наклон: вкл';
      setTimeout(function(){ if(tiltOn && !gotMotion){ window.removeEventListener('devicemotion',onMotion); tiltOn=false; tbtn.textContent='Наклон: нет'; } },2000);
    }
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(function(s){ if(s==='granted') go(); }).catch(function(){});
    } else go();
  };

  window.addEventListener('keydown',function(e){ if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){ e.preventDefault(); shake(); } });
  window.addEventListener('resize',resize);
  setTimeout(function(){ hint.style.opacity=0; },6000);

  var liteBtn=document.getElementById('lite'), coarse=!!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  lite=coarse;
  if(coarse){
    liteBtn.hidden=false; liteBtn.textContent='Движение: '+(lite?'простое':'полное');
    liteBtn.onclick=function(){ lite=!lite; this.textContent='Движение: '+(lite?'простое':'полное'); dirty=true; };
  }
  resize(); setPlay(false); fill(); loop();
})();
</script>
</body>
</html>
